name: bill_samjho
description: "Bill Samjho - Pakistani electricity bill explained in Urdu."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  firebase_core: ^5.0.0
  firebase_crashlytics: ^6.0.0
  firebase_remote_config: ^7.0.0
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_image_compress: ^2.5.1
  flutter_tts: ^4.2.5
  go_router: ^17.5.0
  google_mlkit_document_scanner: ^0.5.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.3.4
  image_picker: ^1.2.4
  intl: ^0.20.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  flutter_secure_storage: ^11.2.0
  firebase_app_check: ^0.5.0
  package_info_plus: ^10.2.2
  webview_flutter: ^4.14.1
  firebase_ai: ^5.0.0
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/tariff_config_default.json
    - assets/i18n/
    - assets/pitc/

  fonts:
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
    # Fetched by scripts/fetch_fonts.sh (licence: embed, do not share the files).
    - family: GeneralSans
      fonts:
        - asset: assets/fonts/GeneralSans-Regular.otf
          weight: 400
        - asset: assets/fonts/GeneralSans-Medium.otf
          weight: 500
        - asset: assets/fonts/GeneralSans-Semibold.otf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono.ttf
